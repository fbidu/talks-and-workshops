name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm

      # The prettier hook shells out to `npx --no-install prettier`, so the
      # pinned formatter has to be on disk before prek runs.
      - name: Install dependencies
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Cache prek
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: prek
        run: uvx prek run --all-files --show-diff-on-failure

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches the failure mode that matters here: a deck that still parses
      # but no longer builds. Every talk is a workspace, so this covers all
      # of them without listing any.
      - name: Build every talk
        run: npm run build --workspaces --if-present
